# UK visitors opening the homepage go to the UK site
[[redirects]]
  from = "/"
  to = "/uk"
  status = 302
  force = true
  conditions = {Country = ["GB"]}

[[redirects]]
  from = "/uk"
  to = "https://lawvoo-uk.vercel.app/uk"
  status = 200
  force = true

[[redirects]]
  from = "/uk/*"
  to = "https://lawvoo-uk.vercel.app/uk/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uk-static/*"
  to = "https://lawvoo-uk.vercel.app/uk-static/:splat"
  status = 200
  force = true

  [[redirects]]
  from = "/ie"
  to = "https://lawvoo-uk.vercel.app/ie"
  status = 200
  force = true

[[redirects]]
  from = "/ie/*"
  to = "https://lawvoo-uk.vercel.app/ie/:splat"
  status = 200
  force = true

# Canada (/ca) — same Vercel app as /uk and /ie; its CSS/JS already come
# through /uk-static/* above.
[[redirects]]
  from = "/ca"
  to = "https://lawvoo-uk.vercel.app/ca"
  status = 200
  force = true

[[redirects]]
  from = "/ca/*"
  to = "https://lawvoo-uk.vercel.app/ca/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# US city URLs changed on 22 Oct 2026 to always include the state
# ("montgomery" -> "montgomery-al"), so cities with the same name in other
# states never clash. Old URLs redirect permanently (301). These must stay
# ABOVE the /us proxy rules below.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/us/locations/birmingham-alabama"
  to = "/us/locations/birmingham-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/lawyers/:area/birmingham-alabama"
  to = "/us/lawyers/:area/birmingham-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/locations/montgomery"
  to = "/us/locations/montgomery-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/lawyers/:area/montgomery"
  to = "/us/lawyers/:area/montgomery-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/locations/huntsville"
  to = "/us/locations/huntsville-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/lawyers/:area/huntsville"
  to = "/us/lawyers/:area/huntsville-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/locations/mobile"
  to = "/us/locations/mobile-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/lawyers/:area/mobile"
  to = "/us/lawyers/:area/mobile-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/locations/dothan"
  to = "/us/locations/dothan-al"
  status = 301
  force = true

[[redirects]]
  from = "/us/lawyers/:area/dothan"
  to = "/us/lawyers/:area/dothan-al"
  status = 301
  force = true

# United States (/us) — same Vercel app as /uk, /ie and /ca.
[[redirects]]
  from = "/us"
  to = "https://lawvoo-uk.vercel.app/us"
  status = 200
  force = true

[[redirects]]
  from = "/us/*"
  to = "https://lawvoo-uk.vercel.app/us/:splat"
  status = 200
  force = true

